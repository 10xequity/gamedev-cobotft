<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E7C86">
  <title>Tactical Boom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=0.9.0">
  <script type="importmap">
  {
    "imports": {
      "./js/arena.js": "./js/arena.js?v=0.9.0",
      "./js/bots.js": "./js/bots.js?v=0.9.0",
      "./js/combat.js": "./js/combat.js?v=0.9.0",
      "./js/economy.js": "./js/economy.js?v=0.9.0",
      "./js/gallery.js": "./js/gallery.js?v=0.9.0",
      "./js/game.js": "./js/game.js?v=0.9.0",
      "./js/hex.js": "./js/hex.js?v=0.9.0",
      "./js/main.js": "./js/main.js?v=0.9.0",
      "./js/playback.js": "./js/playback.js?v=0.9.0",
      "./js/rng.js": "./js/rng.js?v=0.9.0",
      "./js/sprite.js": "./js/sprite.js?v=0.9.0",
      "./js/traits.js": "./js/traits.js?v=0.9.0",
      "./js/ui.js": "./js/ui.js?v=0.9.0",
      "./js/units.js": "./js/units.js?v=0.9.0"
    }
  }
  </script>
</head>
<body class="game">
  <header class="bar" aria-label="Status">
    <span class="stat"><span class="k">HP</span> <b id="hp">20</b></span>
    <span class="stat"><span class="k">Gold</span> <b id="gold">0</b></span>
    <span class="stat"><span class="k">Round</span> <b id="round">1-1</b></span>
    <span class="stat" id="level">Lv 1</span>
    <span class="stat"><span class="k">Time</span> <b id="timer" aria-live="off">30</b></span>
    <button type="button" id="pause" class="ghost" aria-pressed="false">Pause</button>
    <label class="auto"><input type="checkbox" id="auto" checked> Auto-advance</label>
    <button type="button" id="newgame" class="ghost">New game</button>
  </header>

  <section class="zone" aria-labelledby="hCourt">
    <h2 id="hCourt">Court <span class="sub" id="courtCount">0 / 1</span> <span class="sub" id="courtHint">arrow keys move between hexes</span>
      <span class="fightbar" id="fightbar" hidden><button type="button" id="speed" aria-pressed="false">2x</button><button type="button" id="skip">Skip <small>Esc</small></button></span></h2>
    <div class="arena" id="court" role="group" aria-label="Court hexes, your half" data-stage="fieldhouse"></div>
  </section>

  <section class="zone" aria-labelledby="hPlayers">
    <h2 id="hPlayers">Players <span class="sub" id="lastFight"></span></h2>
    <ol class="players" id="players"></ol>
  </section>

  <section class="zone" aria-labelledby="hTraits">
    <h2 id="hTraits">Traits <span class="sub" id="wild"></span></h2>
    <ul class="traits" id="traits"></ul>
  </section>

  <section class="zone" aria-labelledby="hBench">
    <h2 id="hBench">Bench</h2>
    <div class="slots bench" id="bench" role="group" aria-label="Bench slots"></div>
  </section>

  <p class="msg" id="msg" aria-hidden="true"></p>
  <div id="live" class="vh" aria-live="polite"></div>

  <section class="zone" aria-labelledby="hShop">
    <h2 id="hShop">Shop</h2>
    <div class="shop" id="shop" role="group" aria-label="Shop cards"></div>
  </section>

  <nav class="actions" aria-label="Actions">
    <button type="button" id="sell" disabled>Sell</button>
    <button type="button" id="reroll">Reroll <small>1g · R</small></button>
    <button type="button" id="xp">Buy XP <small>4g · X</small></button>
    <button type="button" id="next" class="primary">Next round <small>N</small></button>
  </nav>
  <dialog id="over" aria-labelledby="overTitle">
    <h2 id="overTitle">Game over</h2>
    <p id="overText"></p>
    <ol class="players" id="finalPlaces"></ol>
    <button type="button" id="again" class="primary">New game</button>
  </dialog>
  <script type="module" src="js/main.js?v=0.9.0"></script>
</body>
</html>
