<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E7C86">
  <title>Tactical Boom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--teal:#0E7C86;--teal-dark:#065A62;--teal-light:#E4F2F3;--gold:#E5B800;--gold-dark:#C49A00;--cream:#FFF9F0;--black:#111111}

    h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(28px,8vw,48px);margin:0 0 8px;color:var(--gold)}

<body>
  <main>
    <div>
      <h1>Tactical Boom</h1>
      <p>Staff test build. Milestone 1: roster and checks. Game arrives at milestone 3.</p>

</html>
