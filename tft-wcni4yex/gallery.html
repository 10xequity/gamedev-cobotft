<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E7C86">
  <title>Tactical Boom Gallery</title>
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.30.0">
  <script type="importmap">
  {
    "imports": {
      "./js/achievements.js": "./js/achievements.js?v=2.30.0",
      "./js/arena.js": "./js/arena.js?v=2.30.0",
      "./js/bots.js": "./js/bots.js?v=2.30.0",
      "./js/combat.js": "./js/combat.js?v=2.30.0",
      "./js/economy.js": "./js/economy.js?v=2.30.0",
      "./js/gallery.js": "./js/gallery.js?v=2.30.0",
      "./js/game.js": "./js/game.js?v=2.30.0",
      "./js/guide.js": "./js/guide.js?v=2.30.0",
      "./js/hex.js": "./js/hex.js?v=2.30.0",
      "./js/i18n.js": "./js/i18n.js?v=2.30.0",
      "./js/items.js": "./js/items.js?v=2.30.0",
      "./js/history.js": "./js/history.js?v=2.30.0",
      "./js/ladder.js": "./js/ladder.js?v=2.30.0",
      "./js/main.js": "./js/main.js?v=2.30.0",
      "./js/playback.js": "./js/playback.js?v=2.30.0",
      "./js/rng.js": "./js/rng.js?v=2.30.0",
      "./js/sound.js": "./js/sound.js?v=2.30.0",
      "./js/sprite.js": "./js/sprite.js?v=2.30.0",
      "./js/stage.js": "./js/stage.js?v=2.30.0",
      "./js/traits.js": "./js/traits.js?v=2.30.0",
      "./js/ui.js": "./js/ui.js?v=2.30.0",
      "./js/units.js": "./js/units.js?v=2.30.0"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <h1>Tactical Boom · staff gallery</h1>
    <label>Game role <select id="fRole"><option value="">All</option></select></label>
    <label>Club level <select id="fLevel"><option value="">All</option></select></label>
    <label>Archetype <select id="fArch"><option value="">All</option></select></label>
    <label><span class="vh">Search name</span><input id="fName" type="search" placeholder="Search name"></label>
    <span class="count" id="count" aria-live="polite"></span>
  </header>
  <p class="note">Placeholder looks, drawn from a fixed seed, never matched to the real player. Tap or press Enter on a card to see every pose.</p>
  <main class="grid" id="grid" aria-label="Units"></main>
  <dialog id="dlg" aria-labelledby="dlgName">
    <button class="close" id="dlgClose" type="button">Close</button>
    <h2 id="dlgName"></h2>
    <div class="stage" id="stage"></div>
    <div class="poses" id="poses" role="group" aria-label="Pose"></div>
    <dl id="dlgFacts"></dl>
  </dialog>
  <script type="module" src="js/gallery.js?v=2.30.0"></script>
</body>
</html>
